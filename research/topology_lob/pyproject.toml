[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-lob-research"
version = "0.3.2"
description = "Level-2 LOB topology, fractional differentiation, and custom focal-loss research pipeline"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scipy==1.11.4",
  "scikit-learn==1.3.2",
  "statsmodels==0.14.4",
  "xgboost==2.1.4",
  "imbalanced-learn==0.12.4",
  "numba==0.59.1",
  "matplotlib==3.8.4",
]

[project.optional-dependencies]
tda = ["giotto-tda==0.6.2"]
dev = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["topology_lob", "fi2010", "run"]

[project.scripts]
topology-lob = "run:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
