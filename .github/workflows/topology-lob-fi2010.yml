name: topology-lob-fi2010

on:
  workflow_dispatch:
  push:
    paths:
      - "research/topology_lob/**"
      - ".github/workflows/topology-lob-fi2010.yml"
  pull_request:
    paths:
      - "research/topology_lob/**"
      - ".github/workflows/topology-lob-fi2010.yml"

jobs:
  fi2010:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install constrained research environment
        working-directory: research/topology_lob
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[tda,dev]"

      - name: Unit tests
        working-directory: research/topology_lob
        run: pytest -q --confcutdir=. tests

      - name: Download FI-2010 Decimal-Precision benchmark
        run: |
          mkdir -p /tmp/fi2010
          curl -L --fail --retry 3 -o /tmp/fi2010/data.zip             https://raw.githubusercontent.com/zcakhaa/DeepLOB-Deep-Convolutional-Neural-Networks-for-Limit-Order-Books/master/data/data.zip
          unzip -q /tmp/fi2010/data.zip -d /tmp/fi2010
          find /tmp/fi2010 -maxdepth 2 -type f -name '*DecPre*' -print

      - name: Run exact real-data TDA benchmark
        working-directory: research/topology_lob
        run: |
          python scripts/run_fi2010_benchmark.py             --train /tmp/fi2010/Train_Dst_NoAuction_DecPre_CF_7.txt             --test               /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_7.txt               /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_8.txt               /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_9.txt             --require-gtda             --tda-stride 1000             --out results/fi2010_benchmark.json

      - name: Run real-data feature ablation
        working-directory: research/topology_lob
        run: |
          python scripts/run_fi2010_ablation.py             --train /tmp/fi2010/Train_Dst_NoAuction_DecPre_CF_7.txt             --test               /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_7.txt               /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_8.txt               /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_9.txt             --require-gtda             --tda-stride 1000             --out results/fi2010_ablation.json

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: topology-lob-fi2010-results
          path: |
            research/topology_lob/results/fi2010_benchmark.json
            research/topology_lob/results/fi2010_ablation.json
