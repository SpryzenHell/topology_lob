name: topology-lob

permissions:
  contents: write

on:
  push:
    paths:
      - "research/topology_lob/**"
      - ".github/workflows/topology-lob.yml"
  pull_request:
    paths:
      - "research/topology_lob/**"
      - ".github/workflows/topology-lob.yml"

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/topology_lob
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/topology_lob/pyproject.toml

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[tda,dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run synthetic demo with Giotto-TDA
        run: python run.py demo --config configs/demo.json --out /tmp/topology-lob-demo --require-gtda

      - name: Verify TDA backend
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("/tmp/topology-lob-demo/metrics.json").read_text())
          assert m["tda"]["backend"] == "giotto-tda", m["tda"]
          print("TDA backend:", m["tda"]["backend"])
          PY

      - name: Generate extended experiment evidence
        run: python scripts/generate_evidence.py --events 6000 --out /tmp/topology-lob-evidence --require-gtda

      - name: Validate extended evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/topology-lob-evidence")
          report = json.loads((root / "experimental_validation.json").read_text())
          assert report["main"]["tda_backend"] == "giotto-tda", report["main"]
          assert report["checks"]["gradient_pass"]
          assert report["checks"]["hessian_pass"]
          assert report["data_quality"]["all_pass"] if "data_quality" in report else report["checks"]["all_pass"]
          assert len(report["ablation"]) == 5
          assert len(report["seed_sensitivity"]) == 6
          assert len(report["walk_forward"]) == 5
          for name in [
              "experimental_validation_dashboard.png",
              "robustness_dashboard.png",
              "data_diagnostics_dashboard.png",
          ]:
              assert (root / "figures" / name).is_file()
          for name in ["report_preview.png", "terminal_demo_run.png"]:
              assert (root / "screenshots" / name).is_file()
          print("Extended evidence validation: PASS")
          PY

      - name: Upload extended evidence
        uses: actions/upload-artifact@v4
        with:
          name: topology-lob-extended-evidence
          path: /tmp/topology-lob-evidence

      - name: Build C++ CPU benchmark
        run: cmake -S . -B /tmp/topology-lob-build && cmake --build /tmp/topology-lob-build --config Release

      - name: Run C++ benchmark
        run: /tmp/topology-lob-build/fractional_diff_cpu


  refresh-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/revamp/topology-lob-research'
    needs: python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/topology_lob
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: topology-lob-extended-evidence
          path: /tmp/topology-lob-evidence

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image validation dependencies
        run: python -m pip install -e .

      - name: Refresh README assets
        run: |
          python scripts/generate_main_image.py
          cp /tmp/topology-lob-evidence/figures/experimental_validation_dashboard.png assets/figures/experimental_validation_dashboard.png
          cp /tmp/topology-lob-evidence/figures/robustness_dashboard.png assets/figures/robustness_dashboard.png
          cp /tmp/topology-lob-evidence/figures/data_diagnostics_dashboard.png assets/figures/data_diagnostics_dashboard.png
          cp /tmp/topology-lob-evidence/screenshots/report_preview.png assets/screenshots/report_preview.png
          cp /tmp/topology-lob-evidence/screenshots/terminal_demo_run.png assets/screenshots/terminal_demo_run.png
          rm -f assets/screenshots/report_preview.svg assets/screenshots/terminal_demo_run.svg
          cp assets/main.png ../../main.png
          python scripts/validate_assets.py

      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.png assets/main.png assets/figures assets/screenshots
          if git diff --cached --quiet; then
            echo "No asset changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh verified README evidence assets [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/topology_lob
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check package files
        run: ls -lh dist/
